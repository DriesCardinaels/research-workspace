<!doctype html><html lang="en"><meta charset="utf-8"><title>README preview regression</title>
<link rel="stylesheet" href="../static/theme.css"><link rel="stylesheet" href="../static/workspace.css"><link rel="stylesheet" href="../static/toolbar.css"><link rel="stylesheet" href="../static/vendor/codemirror/codemirror.min.css"><link rel="stylesheet" href="../static/features/markdown/preview.css">
<style>body{background:var(--panel);color:var(--ink);font:14px system-ui}#host{height:700px;display:flex;flex-direction:column;border:1px solid var(--line)}#results{white-space:pre-wrap}</style>
<pre id="results">Running</pre><div id="header"></div><div id="host"></div>
<script src="../static/toolbar.js"></script><script src="../static/file-types.js"></script>
<script>
FileTypes.registry.register({id:'markdown',label:'MD',extensions:['.md','.markdown'],kind:'text',capabilities:{text:true},toolbarAreas:['text.actions','markdown.tools'],open:()=>{}});
FileTypes.registry.register({id:'text',label:'TXT',extensions:['.txt'],kind:'text',capabilities:{text:true},toolbarAreas:['text.actions'],open:()=>{}});
</script>
<script src="../static/vendor/codemirror/codemirror.min.js"></script><script src="../static/editors/source/save-queue.js"></script><script src="../static/text-editor.js"></script><script src="../static/vendor/marked/marked.min.js"></script><script src="../static/vendor/dompurify/purify.min.js"></script><script src="../static/features/markdown/preview.js"></script><script src="../static/features/markdown/tools.js"></script>
<script>
(async()=>{
 const results=document.getElementById('results'), checks=[];
 const assert=(condition,label)=>{if(!condition)throw Error(label);checks.push('PASS '+label);results.textContent=checks.join('\n');};
 try{
  const source='# Research Workbench\r\n\r\n## Install &amp; run\r\n\r\n## Install &amp; run\r\n\r\n| Feature | Status |\r\n| --- | --- |\r\n| Preview | Ready |\r\n\r\n- [x] Done\r\n\r\n~~~js\r\n<script>alert(1)<\/script>\r\n~~~\r\n\r\n<details><summary>More</summary>Content</details>\r\n\r\n![Screenshot](images/test.png)\r\n\r\n[Guide](docs/guide.md)\r\n\r\n[External](https://example.com)\r\n\r\n<script>window.pwned=true<\/script><img onerror="window.pwned=true"><a href="javascript:alert(1)">bad</a><iframe srcdoc="bad"></iframe><style>body{display:none}</style>';
  const files=new Map([['README.md',{text:source,sha:'one'}],['notes.txt',{text:'Plain',sha:'two'}],['docs/guide.md',{text:'# Guide',sha:'three'}]]),errors=[],writes=[];
  let refuse=false;
  const api=async(url,options)=>{
   const body=options?JSON.parse(options.body):null,path=body?.path||new URL(url,location.origin).searchParams.get('path'),snapshot=files.get(path);
   if(!snapshot)throw Error('missing');
   if(body){if(refuse)throw Error('conflict');writes.push(body);snapshot.text=body.text;snapshot.sha='saved';}
   return {file:path,...snapshot};
  };
  const host=new TextWorkspace({api,base:'/api/projects/fixture',message:text=>errors.push(text)});
  document.getElementById('host').append(host.root);await host.openFile('README.md');await host.mount({headerSlot:document.getElementById('header')});
  const cm=host.root.querySelector('.CodeMirror').CodeMirror;
  const preview=()=>host.root.querySelector('.markdown-preview'),button=id=>document.querySelector('[data-tool-id="'+id+'"]');
  assert(host.root.querySelector('.text-content').dataset.view==='split','Markdown opens in Both');
  assert(document.getElementById('header').contains(button('text.view.split'))&&!host.root.contains(button('text.view.split')),'Layout controls mount in the shared document header');
  assert(host.root.querySelector('.text-source-pane').contains(button('markdown.bold'))&&host.root.querySelector('.text-source-pane').contains(host.root.querySelector('[role=tablist]')),'Tabs and formatting belong to source pane');
  assert(host.root.querySelector('.text-preview-pane').contains(preview())&&host.root.querySelector('.ws-preview-header').textContent==='README preview','README occupies the right preview pane');
  assert(host.root.style.height===''&&getComputedStyle(host.root).height==='100%','Editor fills its viewer height');
  const divider=host.root.querySelector('[role=separator]');divider.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true,cancelable:true}));
  assert(divider.getAttribute('aria-valuenow')==='55','Keyboard resizes split panes');
  host.setSplitRatio(2);assert(divider.getAttribute('aria-valuenow')==='75','Split ratio stays confined');host.setSplitRatio(.5);
  const headingMenu=()=>document.querySelector('.markdown-tool-menu[aria-label="Heading level"]');
  for(let level=1;level<=6;level++){
    button('markdown.heading').click();assert(!headingMenu().hidden,'Heading picker opens for H'+level);
    const choice=button('markdown.heading.'+level);assert(choice&&choice.title.includes('Heading '+level),'Heading level has an explicit hover label');
    choice.click();assert(cm.getLine(0)==='#'.repeat(level)+' Research Workbench'&&headingMenu().hidden,'H'+level+' applies to the full line and dismisses picker');
    if(level!==1)button('text.undo').click();
  }
  const listIcons=['markdown.list','markdown.ordered','markdown.task'].map(id=>button(id).querySelector('path').getAttribute('d'));
  assert(new Set(listIcons).size===3,'Bullet, numbered and task lists have distinct icons');
  assert(host.root.contains(button('markdown.ordered')),'Numbered list is directly available beside bullets');
  button('markdown.more').click();assert(!document.querySelector('.markdown-tool-menu[aria-label="More Markdown tools"]').hidden,'Secondary tools open in an overflow menu');
  document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));assert(document.querySelector('.markdown-tool-menu[aria-label="More Markdown tools"]').hidden,'Escape dismisses overflow menu');
  assert(preview().querySelector('table td').textContent==='Preview','GFM table renders');
  assert(preview().querySelector('input[type="checkbox"]').checked,'Task checkbox renders');
  assert(preview().querySelector('pre code').textContent.includes('<script>'),'Fenced code remains literal');
  assert(preview().querySelector('details summary').textContent==='More','Collapsible HTML renders');
  assert(!window.pwned&&!preview().querySelector('script,iframe,style,[onerror],a[href^="javascript:"]'),'Unsafe HTML is sanitized');
  assert(preview().querySelector('img').getAttribute('src')==='/api/projects/fixture/image-file?path=images%2Ftest.png','Images use authorized project route');
  assert(preview().querySelector('a[href="https://example.com"]').rel==='noopener noreferrer','External links are isolated');
  assert(preview().querySelectorAll('h2')[1].id==='install--run-1','Duplicate heading anchors render');
  const toc=MarkdownPreview.contents(source);assert(toc.includes('(#install--run-1)')&&!toc.includes('alert'),'Contents matches rendered entity/duplicate headings and ignores fences');
  cm.setSelection({line:0,ch:2},{line:0,ch:20});button('markdown.bold').click();
  assert(preview().querySelector('h1 strong')?.textContent==='Research Workbench','Toolbar selection edit updates live preview');
  assert(host.unsaved&&writes.length===0,'Preview never writes unsaved buffer');
  button('text.undo').click();assert(cm.getValue()===source,'Native undo restores original source');button('text.redo').click();
  button('text.view.preview').click();assert(host.root.querySelector('.text-source-pane').hidden&&button('markdown.bold').disabled,'Preview mode hides editor and disables editing tools');
  assert(button('text.view.preview').getAttribute('aria-pressed')==='true','View state is accessible');
  let retained=cm.getValue();await host.openFile('notes.txt');assert(!preview(),'Other file types have no README preview');
  await host.openFile('README.md');assert(cm.getValue()===retained&&host.root.querySelector('.text-content').dataset.view==='preview','File switching retains unsaved buffer and view');
  button('text.view.edit').click();assert(host.root.querySelector('.text-preview-pane').hidden,'Edit mode hides preview');
  button('text.view.split').click();
  const event=new KeyboardEvent('keydown',{key:'b',metaKey:/Mac/.test(navigator.platform),ctrlKey:!/Mac/.test(navigator.platform),bubbles:true,cancelable:true});cm.getInputField().dispatchEvent(event);assert(event.defaultPrevented,'Formatting shortcut dispatches');
  assert(cm.getValue()!==retained,'Formatting shortcut edits the native session');retained=cm.getValue();
  refuse=true;await host.saveAll().then(()=>assert(false,'Expected save rejection'),()=>{});assert(host.unsaved&&cm.getValue()===retained,'Failed save preserves Markdown');
  refuse=false;await host.saveAll();assert(!host.unsaved&&writes[0].text===retained,'Save retains native text and revision contract');
  const link=preview().querySelector('a[href="docs/guide.md"]');link.click();await new Promise(resolve=>setTimeout(resolve,0));assert(host.file==='docs/guide.md'&&preview().querySelector('h1').textContent==='Guide','Relative document links navigate through host');
  const old=preview();host.destroy();assert(!old.isConnected&&!document.getElementById('host').children.length&&!document.getElementById('header').children.length&&!document.querySelector('.markdown-tool-menu'),'Destroy removes preview and host');
  assert(errors.length===0,'No unexpected interaction errors');
  results.textContent=checks.join('\n')+'\nALL CHECKS PASSED';
 }catch(error){results.textContent+='\nFAIL '+error.stack;document.body.dataset.failed='true';}
})();
</script></html>
