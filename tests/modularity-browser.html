<!doctype html><meta charset="utf-8"><title>Modularity regression fixture</title>
<link rel="stylesheet" href="/static/theme.css"><link rel="stylesheet" href="/static/toolbar.css"><link rel="stylesheet" href="/static/vendor/codemirror/codemirror.min.css">
<style>body{margin:24px;font:14px system-ui;background:var(--panel);color:var(--ink)}#host{height:360px;display:flex;flex-direction:column;border:1px solid var(--line)}#results{white-space:pre-wrap}button{font:inherit}</style>
<h1>Tool and filetype regression fixture</h1><pre id="results">Running…</pre><div id="host"></div>
<script src="/static/toolbar.js"></script><script src="/static/features/latex/tools.js"></script><script src="/static/features/pdf/tools.js"></script><script src="/static/features/tabs/tools.js"></script><script src="/api/file-types.js"></script><script src="/static/file-types.js"></script><script src="/static/filetype-adapters.js"></script><script src="/static/tool-ui.js"></script><script src="/static/vendor/codemirror/codemirror.min.js"></script><script src="/static/editors/source/save-queue.js"></script><script src="/static/text-editor.js"></script><script src="/static/text-file-types.js"></script><script src="/static/vendor/marked/marked.min.js"></script><script src="/static/vendor/dompurify/purify.min.js"></script><script src="/static/features/markdown/preview.js"></script><script src="/static/features/markdown/tools.js"></script>
<script>
document.addEventListener('DOMContentLoaded',async()=>{
 const results=document.getElementById('results'), checks=[];
 const assert=(condition,label)=>{if(!condition)throw Error(label);checks.push('PASS '+label);results.textContent=checks.join('\n');};
 const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 try{
  const files=new Map([['notes.md',{text:'Alpha\r\nBeta',sha:'one'}],['other.txt',{text:'Other',sha:'two'}]]), errors=[];
  let refuse=false,writes=0;
  const api=async(url,options)=>{
   const data=options?JSON.parse(options.body):null,path=data?.path||new URL(url,location.origin).searchParams.get('path'), current=files.get(path);
   if(!current)throw Error('missing file');
   if(data){if(refuse||data.sha!==current.sha)throw Error('conflict retained');writes++;current.text=data.text;current.sha='revision-'+writes;}
   return {file:path,...current};
  };
  const host=new TextWorkspace({api,base:'/fixture',message:message=>errors.push(message)});
  document.getElementById('host').append(host.root);
  await host.openFile('notes.md');
  assert(host.root.querySelector('[data-tool-id="markdown.bold"]')&&host.root.querySelector('[data-tool-id="text.save"]'),'Markdown provider composes shared actions and dedicated tools');
  const cm=host.root.querySelector('.CodeMirror').CodeMirror;
  cm.setSelection({line:0,ch:0},{line:0,ch:5});
  host.root.querySelector('[data-tool-id="markdown.bold"]').click();
  assert(cm.getValue()==='**Alpha**\r\nBeta','Markdown Tool uses the public session without LaTeX behavior');
  await host.openFile('other.txt');
  assert(host.root.querySelectorAll('.tool-button').length===3,'Plain text has its own toolbar composition');
  cm.replaceRange(' edited',{line:0,ch:5});
  await host.openFile('notes.md');
  assert(cm.getValue()==='**Alpha**\r\nBeta'&&host.unsaved,'Tab switching retains buffers and dirty state');
  host.root.querySelector('[data-tool-id="text.undo"]').click();
  assert(cm.getValue()==='Alpha\r\nBeta','Native per-file undo history survives switching');
  host.root.querySelector('[data-tool-id="text.redo"]').click();
  assert(cm.getValue()==='**Alpha**\r\nBeta','Native redo remains available');
  refuse=true;await host.saveAll().then(()=>{throw Error('conflict accepted');},()=>{});
  assert(host.unsaved&&cm.getValue()==='**Alpha**\r\nBeta','Failed save retains text and dirty state');
  refuse=false;await host.saveAll();
  assert(!host.unsaved&&files.get('other.txt').text==='Other edited','Save all persists every dirty buffer');
  cm.replaceRange(' appended',{line:1,ch:4});
  host.root.dispatchEvent(new KeyboardEvent('keydown',{key:'s',ctrlKey:true,bubbles:true,cancelable:true}));
  await wait(0);assert(!host.unsaved,'Shared Tool shortcut saves through the same action as its button');
  files.get('notes.md').text='External revision';files.get('notes.md').sha='external';
  await host.refreshFromDisk();
  assert(cm.getValue()==='External revision'&&!host.unsaved,'External reload refreshes saved buffers safely');
  const target=host.root.querySelector('[data-tool-id="markdown.bold"]');await wait(0);
  target.dispatchEvent(new PointerEvent('pointerover',{bubbles:true,pointerType:'mouse'}));
  await wait(50);assert(document.querySelector('.tool-tooltip').hidden,'Hover help waits for the configured delay');
  await wait(130);assert(!document.querySelector('.tool-tooltip').hidden,'Styled hover help appears after 150 ms');
  assert(!target.hasAttribute('title')&&target.hasAttribute('aria-describedby'),'Native tooltip is absent and accessible description is linked');
  const tip=document.querySelector('.tool-tooltip').getBoundingClientRect();
  assert(tip.left>=0&&tip.right<=innerWidth&&tip.top>=0&&tip.bottom<=innerHeight,'Tooltip stays within viewport');
  document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
  assert(document.querySelector('.tool-tooltip').hidden&&!target.hasAttribute('aria-describedby'),'Escape removes tooltip and owned description');
  target.dispatchEvent(new PointerEvent('pointerover',{bubbles:true,pointerType:'mouse'}));
  host.destroy();await wait(180);
  assert(document.querySelector('.tool-tooltip').hidden,'Removing a Tool cancels pending hover help');
  assert(!document.querySelector('.text-workspace'),'Editor and Tool hosts dispose cleanly');
  results.textContent=checks.join('\n')+'\nALL CHECKS PASSED';
 }catch(error){results.textContent+='\nFAIL '+error.stack;document.title='FAILED modularity fixture';}
});
</script>
